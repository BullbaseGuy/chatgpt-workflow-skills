name: Validate workflow skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Validate active task state
        run: python scripts/validate_state.py --all-active --enforce-model-zero

      - name: Validate reproduction manifest
        run: python scripts/validate_repro.py tests/fixtures/repro_manifest_valid.yaml

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
